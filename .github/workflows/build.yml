name: Build and Sign APK & AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate signing secrets (fail on missing, never default)
        if: github.event_name != 'pull_request'
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "🚨 ERROR: Missing required signing secrets:$missing"
            echo "Set them in GitHub repo Settings → Secrets and variables → Actions."
            echo "Refusing to sign with any default/fallback password."
            exit 1
          fi
          echo "✅ All signing secrets present."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode keystore from KEYSTORE_BASE64 secret
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if echo "$KEYSTORE_BASE64" | base64 -d -i > app/upload-key.jks 2>/dev/null; then
              echo "KEYSTORE_PATH=${{ github.workspace }}/app/upload-key.jks" >> "$GITHUB_ENV"
              echo "Successfully decoded KEYSTORE_BASE64 secret."
            else
              # NOTE: base64 can exit non-zero on padding quirks while still writing a
              # usable keystore. Warn and verify the file instead of failing outright.
              # Never fall back to a default/hardcoded password.
              echo "Warning: KEYSTORE_BASE64 did not decode cleanly; verifying produced file."
            fi
            if [ ! -s "app/upload-key.jks" ]; then
              echo "🚨 ERROR: KEYSTORE_BASE64 did not produce a usable app/upload-key.jks."
              echo "Refusing to generate a fallback signing key. Fix the secret in repo Settings → Secrets."
              exit 1
            fi
            # Propagate the real secrets for the signing steps below (values stay masked).
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            # No keystore secret (e.g. pull_request validation builds): generate a
            # THROWAWAY keystore with a RANDOM password, for compile validation only.
            # It never signs published artifacts and never uses a default password.
            echo "No KEYSTORE_BASE64 secret — generating throwaway keystore for build validation only..."
            RANDOM_PASS="$(openssl rand -base64 24)"
            keytool -genkeypair -alias "pk_ai_upload" -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore app/upload-key.jks \
              -storepass "$RANDOM_PASS" \
              -keypass "$RANDOM_PASS" \
              -dname "CN=PK AI Upload, OU=Mobile, O=PK AI, L=PK, ST=PK, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/app/upload-key.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$RANDOM_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RANDOM_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=pk_ai_upload" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ultra-ai-chat-space/package-lock.json

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      # Use the decoded keystore (available from earlier step via GITHUB_ENV)

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pk_ai_upload' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      - name: Verify Release AAB Signature Fingerprint
        run: |
          echo "Extracting fingerprints from the generated Release AAB..."
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          FINGERPRINT=$(keytool -printcert -jarfile "$AAB_PATH" | grep "SHA1:" | awk '{print $2}')
          EXPECTED_SHA1="AC:F9:49:5A:C3:0A:AC:A2:CE:3E:10:71:95:73:A6:00:C6:C9:F8:64"
          echo "Extracted SHA1: $FINGERPRINT"
          echo "Expected SHA1:  $EXPECTED_SHA1"
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$FINGERPRINT" ] || [ "$FINGERPRINT" != "$EXPECTED_SHA1" ]; then
              echo "🚨 ERROR: Generated AAB SHA1 ($FINGERPRINT) does not match the expected Upload Key SHA1 ($EXPECTED_SHA1)!"
              exit 1
            fi
            echo "✅ SUCCESS: AAB successfully verified with expected Upload Key SHA1!"
          else
            echo "ℹ️ Validated release AAB build & signing ($FINGERPRINT). (Fingerprint match check strictly enforced when KEYSTORE_BASE64 secret is present)."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug AAB
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: PK-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: PK-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: PK-AI-Debug-AAB
          path: app/build/outputs/bundle/debug/*.aab

      - name: Upload Release AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: PK-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
