name: Build and Sign APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Use the ORIGINAL keystore from the repo (matches Play Store signing certificate)
      # DO NOT regenerate — this keystore has the correct SHA1 fingerprint

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: *** secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: *** secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: *** secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: *** secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: *** secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: *** secrets.TOGETHER_API_KEY }}
          COHERE_API_KEY: *** secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: *** secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: *** secrets.OPENAI_API_KEY }}
          SAMBANOVA_API_KEY: *** secrets.SAMBANOVA_API_KEY }}

      - name: Build Debug AAB
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Debug-AAB
          path: app/build/outputs/bundle/debug/*.aab

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
