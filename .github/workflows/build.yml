name: Build and Sign APK & AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode keystore from KEYSTORE_BASE64 secret
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if echo "$KEYSTORE_BASE64" | base64 -d -i > app/upload-key.jks 2>/dev/null; then
              echo "KEYSTORE_PATH=${{ github.workspace }}/app/upload-key.jks" >> "$GITHUB_ENV"
              echo "Successfully decoded KEYSTORE_BASE64 secret."
            else
              echo "Warning: KEYSTORE_BASE64 secret is not a valid base64 encoded string. Skipping keystore decode."
              rm -f app/upload-key.jks
            fi
          else
            echo "KEYSTORE_BASE64 secret is empty or not provided."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

      # Use the decoded keystore (available from earlier step via GITHUB_ENV)

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

      - name: Verify Release AAB Signature Fingerprint
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "Extracting fingerprints from the generated Release AAB..."
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          FINGERPRINT=$(keytool -printcert -jarfile "$AAB_PATH" | grep "SHA1:" | awk '{print $2}')
          EXPECTED_SHA1="AC:F9:49:5A:C3:0A:AC:A2:CE:3E:10:71:95:73:A6:00:C6:C9:F8:64"
          echo "Extracted SHA1: $FINGERPRINT"
          echo "Expected SHA1:  $EXPECTED_SHA1"
          if [ -z "$FINGERPRINT" ] || [ "$FINGERPRINT" != "$EXPECTED_SHA1" ]; then
            echo "🚨 ERROR: Generated AAB SHA1 ($FINGERPRINT) does not match the expected Upload Key SHA1 ($EXPECTED_SHA1)!"
            exit 1
          fi
          echo "✅ SUCCESS: AAB successfully verified with expected Upload Key SHA1!"

      - name: Build Debug AAB
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Debug-AAB
          path: app/build/outputs/bundle/debug/*.aab

      - name: Upload Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
