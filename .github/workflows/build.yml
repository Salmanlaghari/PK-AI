name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Generate Release Keystore
      run: |
        KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
        KEY_PASS="${{ secrets.KEY_PASSWORD }}"
        # Fallback to default passwords if secrets not set
        if [ -z "$KEYSTORE_PASS" ]; then KEYSTORE_PASS="pass123456"; fi
        if [ -z "$KEY_PASS" ]; then KEY_PASS="pass123456"; fi
        # Remove existing keystore if present
        rm -f ailatestfinder-release.jks
        keytool -genkey -v \
          -keystore ailatestfinder-release.jks \
          -alias ailatestfinder \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$KEYSTORE_PASS" \
          -keypass "$KEY_PASS" \
          -dname "CN=SalmanLaghari, OU=Mobile, O=PKAI, L=Karachi, S=Sindh, C=PK"
        # Write keystore properties for Gradle
        echo "storeFile=ailatestfinder-release.jks" > keystore.properties
        echo "storePassword=$KEYSTORE_PASS" >> keystore.properties
        echo "keyAlias=ailatestfinder" >> keystore.properties
        echo "keyPassword=$KEY_PASS" >> keystore.properties

    - name: Build Release APK
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Get version name
      id: version
      run: echo "version=$(grep versionName app/build.gradle.kts | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PK-AI-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
        draft: false
        prerelease: false
