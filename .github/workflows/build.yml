name: Build and Sign APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug AAB
        run: ./gradlew bundleDebug --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (Signed)
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Release-APK-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Debug-AAB
          path: app/build/outputs/bundle/debug/*.aab

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PK-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
